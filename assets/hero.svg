<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Sad-Bin Alam</title>
  <desc id="d">Animated banner for Sad-Bin Alam, an ASP.NET, C# and Go developer from Dhaka, Bangladesh. The core stack (C#, .NET, Go, PostgreSQL, MSSQL) floats around a central hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset=".55" stop-color="#14123a"/>
      <stop offset="1" stop-color="#0b2540"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .role{opacity:0;animation:role 12s ease-in-out infinite}
    .r1{opacity:1}
    .r2{animation-delay:3s}
    .r3{animation-delay:6s}
    .r4{animation-delay:9s}
    @keyframes role{
      0%{opacity:0;transform:translateY(10px)}
      5%{opacity:1;transform:translateY(0)}
      22%{opacity:1;transform:translateY(0)}
      27%{opacity:0;transform:translateY(-10px)}
      100%{opacity:0}
    }
    .chip{animation:float 6s ease-in-out infinite}
    .k2{animation-duration:7s;animation-delay:-2s}
    .k3{animation-duration:5.5s;animation-delay:-1s}
    .k4{animation-duration:6.5s;animation-delay:-3.5s}
    .k5{animation-duration:7.5s;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .link{stroke-dasharray:3 7;animation:flow 2.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-40}}
    .ring{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-out infinite}
    .ring2{animation-delay:-1.6s}
    @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2);opacity:0}}
    .blink{animation:blink 1.1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .role,.chip,.link,.ring,.blink{animation:none}
      .role{opacity:0}.r1{opacity:1}.ring{opacity:0}
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="940" cy="170" r="230" fill="url(#glow)"/>

    <!-- left: name and rotating role line -->
    <text class="mono" x="72" y="92" font-size="15" letter-spacing="4" fill="#7dd3fc">HI, I'M</text>
    <text x="72" y="168" font-size="68" font-weight="800" fill="url(#tg)">Sad-Bin Alam</text>
    <g font-size="24" fill="#cbd5e1">
      <text class="role r1" x="74" y="218">ASP.NET · C# · MSSQL — where I'm at home</text>
      <text class="role r2" x="74" y="218">Go + PostgreSQL for systems that run a business</text>
      <text class="role r3" x="74" y="218">Web data extraction &amp; automation</text>
      <text class="role r4" x="74" y="218">ERP, billing &amp; inventory, built end to end</text>
    </g>
    <g transform="translate(80,276)" fill="#94a3b8">
      <path d="M0-10a6.5 6.5 0 0 1 6.5 6.5c0 5-6.5 11-6.5 11s-6.5-6-6.5-11A6.5 6.5 0 0 1 0-10z" fill="#38bdf8"/>
      <circle cy="-3.5" r="2.4" fill="#0a0f1f"/>
      <text class="mono" x="20" y="1" font-size="15">Dhaka · Bangladesh</text>
      <rect class="blink" x="190" y="-12" width="9" height="16" fill="#7dd3fc"/>
    </g>

    <!-- right: core stack orbiting a hub -->
    <g fill="none" stroke="#818cf8" stroke-opacity=".55" stroke-width="1.5">
      <line class="link" x1="940" y1="170" x2="803" y2="89"/>
      <line class="link" x1="940" y1="170" x2="1052" y2="75"/>
      <line class="link" x1="940" y1="170" x2="813" y2="251"/>
      <line class="link" x1="940" y1="170" x2="1069" y2="269"/>
      <line class="link" x1="940" y1="170" x2="1121" y2="169"/>
    </g>
    <circle class="ring" cx="940" cy="170" r="46" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle class="ring ring2" cx="940" cy="170" r="46" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="940" cy="170" r="46" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
    <text class="mono" x="940" y="166" font-size="12" letter-spacing="2" text-anchor="middle" fill="#e0e7ff">CORE</text>
    <text class="mono" x="940" y="183" font-size="12" letter-spacing="2" text-anchor="middle" fill="#e0e7ff">STACK</text>

    <g class="mono" font-size="15" font-weight="700" fill="#f1f5f9">
      <g class="chip">
        <rect x="770" y="70" width="66" height="38" rx="19" fill="#0f172a" stroke="#a78bfa"/>
        <circle cx="788" cy="89" r="5" fill="#a78bfa"/>
        <text x="800" y="94.5">C#</text>
      </g>
      <g class="chip k2">
        <rect x="1010" y="56" width="84" height="38" rx="19" fill="#0f172a" stroke="#818cf8"/>
        <circle cx="1028" cy="75" r="5" fill="#818cf8"/>
        <text x="1040" y="80.5">.NET</text>
      </g>
      <g class="chip k3">
        <rect x="780" y="232" width="66" height="38" rx="19" fill="#0f172a" stroke="#38bdf8"/>
        <circle cx="798" cy="251" r="5" fill="#38bdf8"/>
        <text x="810" y="256.5">Go</text>
      </g>
      <g class="chip k4">
        <rect x="1000" y="250" width="138" height="38" rx="19" fill="#0f172a" stroke="#60a5fa"/>
        <circle cx="1018" cy="269" r="5" fill="#60a5fa"/>
        <text x="1030" y="274.5">PostgreSQL</text>
      </g>
      <g class="chip k5">
        <rect x="1075" y="150" width="93" height="38" rx="19" fill="#0f172a" stroke="#f472b6"/>
        <circle cx="1093" cy="169" r="5" fill="#f472b6"/>
        <text x="1105" y="174.5">MSSQL</text>
      </g>
    </g>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img" aria-labelledby="t d">
  <title id="t">What I am building right now</title>
  <desc id="d">An animated terminal window that lists current work: a data-extraction platform, a multi-tenant ERP core, a courier billing platform, pharmacy and inventory apps, and AI mail triage with small tools, each with its stack.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15px}
    .dim{fill:#8b949e}
    .fg{fill:#e6edf3}
    .ok{fill:#3fb950}
    .pr{fill:#7ee787}
    .ac{fill:#79c0ff}
    .l{opacity:0;animation:in .5s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .l1{animation-delay:.3s}.l2{animation-delay:.9s}.l3{animation-delay:1.6s}.l4{animation-delay:2.2s}
    .l5{animation-delay:2.7s}.l6{animation-delay:3.2s}.l7{animation-delay:3.7s}.l8{animation-delay:4.2s}.l9{animation-delay:4.9s}
    .cur{animation:blink 1.1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none}.cur{animation:none}}
  </style>

  <rect x=".5" y=".5" width="899" height="391" rx="14" fill="#0d1117" stroke="#30363d"/>
  <path d="M.5 14.5a14 14 0 0 1 14-14h871a14 14 0 0 1 14 14V44H.5z" fill="#161b22"/>
  <path d="M.5 44H899.5" stroke="#30363d"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="22" r="6" fill="#27c93f"/>
  <text x="450" y="27" text-anchor="middle" class="dim" font-size="13">~/now — zsh</text>

  <g>
    <g class="l l1"><text x="32" y="82"><tspan class="pr">$</tspan><tspan class="fg"> whoami</tspan></text></g>
    <g class="l l2"><text x="32" y="108" class="ac">sad-bin-alam</text><text x="148" y="108" class="dim">· C# · .NET · MSSQL · Go · PostgreSQL</text></g>

    <g class="l l3"><text x="32" y="152"><tspan class="pr">$</tspan><tspan class="fg"> now --list</tspan></text></g>

    <g class="l l4"><text x="32" y="188"><tspan class="ok">▸</tspan><tspan class="fg"> data-extraction platform</tspan></text><text x="868" y="188" text-anchor="end" class="dim">Next.js · Prisma · Redis · Bun</text></g>
    <g class="l l5"><text x="32" y="220"><tspan class="ok">▸</tspan><tspan class="fg"> multi-tenant ERP core</tspan></text><text x="868" y="220" text-anchor="end" class="dim">Go · Connect RPC · PostgreSQL</text></g>
    <g class="l l6"><text x="32" y="252"><tspan class="ok">▸</tspan><tspan class="fg"> courier billing platform</tspan></text><text x="868" y="252" text-anchor="end" class="dim">Go · React · PostgreSQL</text></g>
    <g class="l l7"><text x="32" y="284"><tspan class="ok">▸</tspan><tspan class="fg"> pharmacy &amp; inventory apps</tspan></text><text x="868" y="284" text-anchor="end" class="dim">React · Electron · Prisma</text></g>
    <g class="l l8"><text x="32" y="316"><tspan class="ok">▸</tspan><tspan class="fg"> AI mail triage + small tools</tspan></text><text x="868" y="316" text-anchor="end" class="dim">TanStack Start · Bun</text></g>

    <g class="l l9"><text x="32" y="360"><tspan class="pr">$</tspan></text><rect class="cur" x="52" y="346" width="9" height="18" fill="#c9d1d9"/></g>
